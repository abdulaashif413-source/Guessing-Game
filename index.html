<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guessing Game</title>
  <link rel="stylesheet"  href="styles/guess.css">
  </head>

<body>

  <h1>Number - Guessing - Game</h1>

  
  <button onclick="
    ComputerMove(1);
     ">1</button>
    


    
      <button onclick="
     ComputerMove(2);
     ">2</button>
    
     
    
      <button onclick="
     ComputerMove(3);
     ">3</button>
    
     
    
      <button onclick="
      ComputerMove(4);
     ">4</button>
    
     
    
       <button onclick="
     ComputerMove(5);
     ">5</button><br>
    

    
     <button onclick="
     ComputerMove(6);
     ">6</button>
    

   
     <button onclick="
      ComputerMove(7);
     ">7</button>

    
     <button onclick="
     ComputerMove(8)
     ">8</button>
    

    
     <button onclick="
     ComputerMove(9);
     ">9</button>
    

    
     <button onclick="
      ComputerMove(10);
     ">10</button>
    
    

     <p class="js-our-move"></p>
     <p class="js-result-dispaly"></p>
     <p class="js-score"></p>
     

     <button onclick="
     score.matches = 0;
     score.Toohigh = 0;
     score.Toolow = 0;
     localStorage.removeItem('score');
     updateScoreElement();
      ">Reset</button>

     

  <script>
   let score = JSON.parse(localStorage.getItem
    ('score'));

    if(score === null){
      score = {
        matches: 0,
        Toohigh: 0,
        Toolow: 0
      }
    }
      
     updateScoreElement();


   function ComputerMove (playerMove) {
      
    let computerNumber = Math.floor
      (Math.random() * 10) + 1;
     

     let result='';

     if(computerNumber === playerMove ) {
      result = 'matches';
     }else if(computerNumber > playerMove) { 
      result = 'Too high';
     }else if(computerNumber < playerMove) {
      result = 'Too low';
     }

     if(result === 'matches') {
      score.matches ++;
     }else if(result === 'Too high') {
      score.Toohigh ++;
     }else if(result === 'Too low'){
      score.Toolow ++;
     }
     

     document.querySelector('.js-our-move')
      .innerHTML = `You choose "${playerMove}" 
       computer choose "${computerNumber}"`;

     document.querySelector('.js-result-dispaly')
      .innerHTML = `Result "${result}"`;  

      localStorage.setItem ('score',JSON.stringify(score));

      updateScoreElement();

      
   }

   function updateScoreElement () {
      document.querySelector('.js-score')
       .innerHTML = ` matches - "${score.matches}" ||
         Too high - "${score.Toohigh}" || Too low - "${score.Toolow}" `;

   }

  </script>
</body>
</html>
